- title: Research Projects
  type: time_table
  contents:
    - title: "Simulated Patient: Animatable 4D Head Avatars"
      institution: 3D Vision & Computer Graphics · PyTorch, CUDA, C++, OpenGL, pycolmap
      year: Aug 2024 - Present
      description:
        - End-to-end pipeline reconstructing photorealistic, animatable 4D head avatars with 3D Gaussian Splatting from sparse multi-view RGB captures, used as patient faces in elderly-care training.
        - Removed explicit camera calibration by refining feed-forward coarse pose estimates with pycolmap to supervise a deformable cross-view point-map network (UR 2026, first author).
        - Customized the Looking Glass Core SDK to stream 3DGS avatars in real time on holographic displays; wrote CUDA kernels for faster 3DGS rendering on an RTX 4060 (ICEIC).
    - title: "Simulated Patient: Generative Facial Behavior"
      institution: Generative Behavior · Python, PyTorch
      year: Jan 2022 - Present
      description:
        - Data-driven 3D head avatar that reacts to speech and visual stimuli in in-the-wild scenarios, driving the digital twin's facial behavior (IEEE TCSS; REACT 2024 Challenge winner).
        - Converted monocular video into 3DMM animations for dataset acquisition; designed a multi-view stereo tracker with learnable camera parameters for better alignment.
    - title: "Simulated Patient: Robotic Arm for Elderly Care Training"
      institution: Robotics & Mixed Reality · Python, ROS 2, Unity/Unreal
      year: Jan 2022 - Present
      description:
        - Prototyped a robotic shoulder-arm complex giving the digital twin a physical body for Range-of-Motion (ROM) training.
        - Pain-response facial expressions modulated by the trainee's performance, integrated into a VR environment.

